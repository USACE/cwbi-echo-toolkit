name: Tag Release

on:
  push:
    tags:
      - "v*.*.*"

  # Allow the workflow to be triggered manually
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: true
