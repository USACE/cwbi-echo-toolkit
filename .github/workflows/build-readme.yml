name: Build readme with go docs

on:
  push:
    branches:
      - "main"
      - "v*"
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  # Allow the workflow to be triggered manually
  workflow_dispatch:

jobs:
  gomarkdoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push back to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # safer for pushing tags/branches

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install gomarkdoc
        run: |
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate Docs
        run: |
          gomarkdoc --include-unexported \
                    --header "# Go Module Documentation" \
                    --output README.md \
                    --embed .

      - name: Commit and push README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes; skipping commit."
            exit 0
          fi
          git commit -m "Update README from gomarkdoc"
          git push origin HEAD:${{ github.ref_name }}
